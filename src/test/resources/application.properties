spring.application.name=ticket-booking-test

spring.datasource.url=jdbc:h2:mem:ticket_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Avoid noisy endpoint catalog logs in test output
app.log-endpoints=false

# JWT test config (HMAC-SHA256)
app.jwt.secret=test_secret_test_secret_test_secret_32+
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

# Feature 5: keep integrations disabled in tests
app.email.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
