spring.application.name=ticket-booking

# 1. Địa chỉ database (movie_db là tên kho dữ liệu của bạn)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_db?createDatabaseIfNotExist=true
# 2. Tài khoản & Mật khẩu bạn vừa cài
spring.datasource.username=root
spring.datasource.password=PrgrmAs@012427

# 3. Hibernate giúp tự động tạo bảng từ code Java (rất tiện)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (HMAC-SHA256). NOTE: In real environments, move secret to env var.
# Must be >= 32 chars for HS256.
app.jwt.secret=CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

# Booking hold/locking
app.booking.hold-ttl-seconds=300
app.booking.cleanup-delay-ms=60000

# Email (disabled by default; enable in dev profile)
app.email.enabled=false
app.email.from=no-reply@example.com
app.email.send-welcome=true
app.email.send-login-notification=true

# Swagger/OpenAPI (disabled by default; enable in dev profile)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false